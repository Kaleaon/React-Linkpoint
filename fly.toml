# Fly.io config for the Linkpoint bridge.
# Replace `app` with your own unique app name (or let `fly launch` rewrite it).
app = "linkpoint-bridge"
primary_region = "iad"

[build]

[env]
  NODE_ENV = "production"
  PORT = "3000"
  # Set the secrets below with `fly secrets set`, not here:
  #   APP_URL=https://your-vercel-domain.example
  #   PROXY_PERMIT_SECRET=<long random string>

[http_service]
  internal_port = 3000
  force_https = true
  # Keep one machine running: stopping it would drop WebSocket/UDP bridges
  # and log avatars out.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/api/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
