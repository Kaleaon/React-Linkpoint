<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <meta
      name="description"
      content="A tool for parsing, serializing, and visualizing Linden Lab Structured Data (LLSD) in XML, Notation, and JSON formats."
    />
    <meta property="og:title" content="Linkpoint" />
    <meta
      property="og:description"
      content="A tool for parsing, serializing, and visualizing Linden Lab Structured Data (LLSD) in XML, Notation, and JSON formats."
    />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />
    <title>Linkpoint</title>
    <style>
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
      }
      html,
      body {
        background-color: #0b1020;
        overflow: hidden;
      }
      .lp-boot-placeholder {
        width: 100%;
        height: 100%;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #0b1020;
      }
      .lp-boot-crystal {
        width: 88px;
        height: 88px;
        display: block;
        overflow: visible;
      }
      @keyframes lpldTop {
        0%,
        12% {
          transform: translateY(-64px);
        }
        40%,
        62% {
          transform: translateY(0);
        }
        88%,
        100% {
          transform: translateY(-64px);
        }
      }
      @keyframes lpldBot {
        0%,
        12% {
          transform: translateY(64px);
        }
        40%,
        62% {
          transform: translateY(0);
        }
        88%,
        100% {
          transform: translateY(64px);
        }
      }
      @keyframes lpldCore {
        0%,
        12% {
          opacity: 0.2;
          transform: scale(0.55);
        }
        40%,
        62% {
          opacity: 1;
          transform: scale(1.1);
        }
        88%,
        100% {
          opacity: 0.2;
          transform: scale(0.55);
        }
      }
      @keyframes lpldRing {
        0%,
        12% {
          opacity: 0.15;
          r: 25.6px;
        }
        40%,
        62% {
          opacity: 0.5;
          r: 128px;
        }
        88%,
        100% {
          opacity: 0.15;
          r: 25.6px;
        }
      }
      .lpld-top {
        animation: lpldTop 2.6s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      .lpld-bot {
        animation: lpldBot 2.6s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      .lpld-core {
        transform-origin: 256px 256px;
        animation: lpldCore 2.6s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      .lpld-ring {
        transform-origin: 256px 256px;
        animation: lpldRing 2.6s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      @media (prefers-reduced-motion: reduce) {
        .lpld-top,
        .lpld-bot,
        .lpld-core,
        .lpld-ring {
          animation: none;
        }
        .lpld-top {
          transform: translateY(-64px);
        }
        .lpld-bot {
          transform: translateY(64px);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="lp-boot-placeholder">
        <svg
          class="lp-boot-crystal"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 512 512"
          width="88"
          height="88"
          role="img"
          aria-label="Loading Linkpoint"
        >
          <defs>
            <linearGradient id="face1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#6CFF9A" stop-opacity="1" />
              <stop offset="100%" stop-color="#123B27" stop-opacity="1" />
            </linearGradient>
            <linearGradient id="face2Grad" x1="100%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#8AD0B0" stop-opacity="1" />
              <stop offset="100%" stop-color="#365047" stop-opacity="1" />
            </linearGradient>
            <linearGradient id="face3Grad" x1="50%" y1="100%" x2="50%" y2="0%">
              <stop offset="0%" stop-color="#365047" stop-opacity="1" />
              <stop offset="100%" stop-color="#123B27" stop-opacity="1" />
            </linearGradient>
            <linearGradient id="face4Grad" x1="0%" y1="100%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#6CFF9A" stop-opacity="1" />
              <stop offset="100%" stop-color="#8AD0B0" stop-opacity="1" />
            </linearGradient>
            <radialGradient id="coreGrad" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
              <stop offset="55%" stop-color="#6CFF9A" stop-opacity="0.8" />
              <stop offset="100%" stop-color="#6CFF9A" stop-opacity="0" />
            </radialGradient>
          </defs>
          <circle
            class="lpld-ring"
            cx="256"
            cy="256"
            r="25.6"
            fill="none"
            stroke="#6CFF9A"
            stroke-width="1"
            vector-effect="non-scaling-stroke"
          />
          <g class="lpld-bot">
            <polygon
              points="392,342 256,392 120,342 256,292"
              fill="#123B27"
              stroke="#365047"
              stroke-opacity="0.6"
              stroke-width="1.5"
              stroke-linejoin="round"
            />
            <polygon
              points="256,472 392,342 256,392"
              fill="url(#face4Grad)"
              opacity="0.9"
              stroke="#365047"
              stroke-width="1.5"
              stroke-linejoin="round"
            />
            <polygon
              points="256,472 256,392 120,342"
              fill="url(#face3Grad)"
              opacity="0.9"
              stroke="#365047"
              stroke-width="1.5"
              stroke-linejoin="round"
            />
            <polygon
              points="256,472 120,342 256,292"
              fill="url(#face1Grad)"
              opacity="0.9"
              stroke="#365047"
              stroke-width="1.5"
              stroke-linejoin="round"
            />
            <polygon
              points="256,472 256,292 392,342"
              fill="url(#face2Grad)"
              opacity="0.9"
              stroke="#365047"
              stroke-width="1.5"
              stroke-linejoin="round"
            />
          </g>
          <g class="lpld-top">
            <polygon
              points="392,170 256,220 120,170 256,120"
              fill="#123B27"
              stroke="#6CFF9A"
              stroke-opacity="0.6"
              stroke-width="1.5"
              stroke-linejoin="round"
            />
            <polygon
              points="256,40 392,170 256,220"
              fill="url(#face1Grad)"
              opacity="1.0"
              stroke="#365047"
              stroke-width="1.5"
              stroke-linejoin="round"
            />
            <polygon
              points="256,40 256,220 120,170"
              fill="url(#face2Grad)"
              opacity="1.0"
              stroke="#365047"
              stroke-width="1.5"
              stroke-linejoin="round"
            />
            <polygon
              points="256,40 120,170 256,120"
              fill="url(#face3Grad)"
              opacity="0.9"
              stroke="#365047"
              stroke-width="1.5"
              stroke-linejoin="round"
            />
            <polygon
              points="256,40 256,120 392,170"
              fill="url(#face4Grad)"
              opacity="0.9"
              stroke="#365047"
              stroke-width="1.5"
              stroke-linejoin="round"
            />
            <polyline
              points="120,170 256,120 392,170"
              fill="none"
              stroke="#6CFF9A"
              stroke-opacity="0.45"
              stroke-width="1.5"
              stroke-linejoin="round"
            />
          </g>
          <circle class="lpld-core" cx="256" cy="256" r="64" fill="url(#coreGrad)" />
        </svg>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
