# electron-builder configuration for the Linkpoint desktop packages.
#
# The desktop app is the Vite web build (dist/) loaded from disk by
# electron/main.cjs. `main` is injected through extraMetadata instead of a
# top-level package.json "main" field, because Expo resolves the native app
# entry from that same field and would otherwise bundle the Electron entry.
appId: io.linkpoint.viewer
productName: Linkpoint
copyright: Copyright © Linkpoint contributors
asar: true

directories:
  output: build-desktop

# The Electron main process only uses `electron` and Node built-ins, so the
# project's runtime dependencies (expo, react-native, vite, ...) are excluded.
# Leaving them in inflates the package from a few hundred KB to ~280 MB.
files:
  - dist/**/*
  - electron/**/*
  - package.json
  - '!node_modules/**/*'

extraMetadata:
  main: electron/main.cjs

artifactName: ${productName}-${version}-${os}-${arch}.${ext}

win:
  target:
    - target: nsis
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

mac:
  category: public.app-category.social-networking
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]

dmg:
  writeUpdateInfo: false

linux:
  category: Network
  synopsis: Second Life communicator and viewer utility suite
  maintainer: Linkpoint Contributors <noreply@users.noreply.github.com>
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
