name: Sync Linkpoint Design

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [design-updated]

jobs:
  sync-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci || npm install --legacy-peer-deps

      - name: Sync design from linkpoint-design
        run: npm run sync-design

      - name: Verify build and tests
        run: |
          npm run build
          npm test

      - name: Commit design updates if changes exist
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add .
            git commit -m "chore(design): auto-sync latest designs from linkpoint-design"
          else
            echo "No design changes detected."
          fi
