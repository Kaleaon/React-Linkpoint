name: Deploy backend to Fly.io

# Deploys server.ts (the Second Life backend: UDP protocol, sessions, API)
# to Fly.io. Vercel cannot host this (no UDP, no long-lived connections),
# so it runs on Fly.io while Vercel serves the frontend and proxies /api/*.
#
# Required repo secret: FLY_API_TOKEN (a Fly.io deploy token for the
# linkpoint-backend app). Create with: fly tokens create deploy -a linkpoint-backend

on:
  push:
    branches: [main]
    paths:
      - 'server.ts'
      - 'src/server/**'
      - 'Dockerfile'
      - 'fly.toml'
      - 'package.json'
      - '.npmrc'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fly-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pre-deploy:
    name: Pre-deployment checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22.x
      - name: Setup Bun
        uses: oven-sh/setup-bun@4bc047ad259df6fc24a6c9b0f9a0cb08cf17fbe5 # v2.0.1
        with:
          bun-version-file: package.json
      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: TypeScript type check
        run: npm run typecheck
      - name: ESLint check
        run: npm run lint
      - name: Unit tests (Vitest)
        run: npm run test

  deploy:
    name: Deploy to Fly.io
    needs: pre-deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # master
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
