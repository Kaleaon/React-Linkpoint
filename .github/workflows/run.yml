name: Jules PR Reviewer

on:
  pull_request:

permissions:
  pull-requests: write
  contents: read
  checks: write

jobs:
  jules-review:
    name: Automated PR Review
    if: ${{ github.event_name == 'pull_request' && !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
      checks: write
    env:
      JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
    steps:
      - name: Jules review
        if: ${{ env.JULES_API_KEY != '' }}
        uses: thalesraymond/jules-pr-reviewer@47388f11f27513e89e74a068ad51aa7a0d7ea306 # v1.0.0
        with:
          jules_api_key: ${{ secrets.JULES_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
