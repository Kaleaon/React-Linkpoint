name: OpenSim live tests

# Starts a real OpenSim 0.9.3 on the runner (two regions, two local test accounts, a generated OAR), then runs the live
# tests in android-kotlin/core against it: login, terrain, prims/mesh/sculpt/textures, teleport, border crossing, IM,
# friends, teleport offers, radar, profiles. No secrets are involved: the accounts exist only in that throwaway grid.
on:
  workflow_dispatch:
  schedule:
    - cron: '41 3 * * *'   # nightly (runs on the default branch)
  pull_request:
    paths:
      - 'android-kotlin/core/**'
      - 'android-kotlin/mockgrid/**'
      - 'android-kotlin/tools/opensim/**'
      - '.github/workflows/opensim-live.yml'

permissions:
  contents: read

concurrency:
  group: opensim-live-${{ github.ref }}
  cancel-in-progress: true

jobs:
  opensim:
    name: Live tests against OpenSim
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android-kotlin
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.0.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.0.0
        with:
          dotnet-version: '8.0.x'
      - name: Install libgdiplus (OpenSim's map tile renderer needs it)
        run: sudo apt-get update && sudo apt-get install -y libgdiplus
      - name: Cache the OpenSim download
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: ~/.cache/linkpoint-opensim
          key: opensim-0.9.3.0
      - name: Run the live tests
        run: python3 tools/opensim/live.py
      - name: Keep the reports and OpenSim's own log
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: opensim-live-reports
          path: |
            android-kotlin/core/build/reports/tests/test
            /tmp/linkpoint-opensim/opensim.log
          retention-days: 7
