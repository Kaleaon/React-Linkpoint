name: Linkpoint CI/CD

on:
  push:
    branches: [ main, master, development ]
  pull_request:
    branches: [ main, master, development ]

jobs:
  test:
    name: Run Unit Tests and Linting
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run ESLint
      run: npm run lint
      continue-on-error: true # Warning only for now, adjust based on project strictness

    - name: Run Unit Tests (Vitest)
      run: npm run test -- --run # '--run' forces vitest to run once and exit instead of watching

    # Future phases will add jobs here for:
    # - Build Desktop App (Tauri/Electron)
    # - Build Mobile Apps (EAS)
    # - Deploy Web App to GitHub Pages
