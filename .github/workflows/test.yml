name: Linkpoint CI/CD

on:
  push:
    branches: [ main, master, development ]
  pull_request:
    branches: [ main, master, development ]

permissions:
  contents: read

jobs:
  test:
    name: Run Unit Tests and Linting
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
    - name: Checkout repository
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
      with:
        node-version: ${{ matrix.node-version }}
    - name: Set up Bun
      uses: oven-sh/setup-bun@4bc047ad259df6fc24a6c9b0f9a0cb08cf17fbe5 # v2.0.1
      with:
        bun-version-file: package.json


    - name: Install dependencies
      run: bun install --frozen-lockfile

    - name: Run TypeScript type check
      run: npm run lint

    - name: Check for fabricated data
      run: npm run check:fake-data

    - name: Run Unit Tests (Vitest)
      run: npm run test

    - name: Build production bundle
      run: npm run build

    # Future phases will add jobs here for:
    # - Build Desktop App (Tauri/Electron)
    # - Build Mobile Apps (EAS)
    # - Deploy Web App to GitHub Pages
