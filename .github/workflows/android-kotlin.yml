name: Native Kotlin Android app

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'android-kotlin/**'
      - '.github/workflows/android-kotlin.yml'
  push:
    branches: [main]
    paths:
      - 'android-kotlin/**'

permissions:
  contents: read

jobs:
  build:
    name: Test core and build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android-kotlin
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Unit and end-to-end tests (core)
        run: ./gradlew :core:test --no-daemon

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: kotlin-core-test-reports
          path: android-kotlin/core/build/reports/tests/test
          retention-days: 7

      - name: Upload debug APK
        uses: actions/upload-artifact@v6
        with:
          name: linkpoint-kotlin-debug-apk
          path: android-kotlin/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
